[project]
name = "stario"
version = "5.8.1"
description = "Craft realtime hypermedia apps that are a joy to write and ship."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "vendor/llhttp/LICENSE-MIT"]
authors = [
    { name = "Adam Bobowski", email = "adam.bobowski@wratilabs.com" }
]
requires-python = ">=3.12"
keywords = ["asyncio", "http", "hypermedia", "html", "sse", "framework"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Cython",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://stario.dev"
Documentation = "https://stario.dev/docs"
Repository = "https://github.com/stariodev/stario"
Changelog = "https://github.com/stariodev/stario/blob/main/CHANGELOG.md"
Issues = "https://github.com/stariodev/stario/issues"

[project.optional-dependencies]
# uvloop has no Windows build; the extra is empty there.
uvloop = ["uvloop>=0.21.0,<1; sys_platform != 'win32'"]

[build-system]
requires = ["setuptools>=77", "Cython>=3.1,<4"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["stario", "stario.*", "stario_cython"]

[tool.setuptools.package-data]
"*" = ["py.typed", "*.pyi"]

[tool.setuptools.exclude-package-data]
stario_cython = ["*.c", "*.pxd", "*.pxi", "*.pyx"]

# Wheels bundle nghttp2, Brotli 1.2.1, and zstd built by scripts/build-native-deps.sh
# (manylinux ships an nghttp2 that predates the CONTINUATION flood fix), or by
# scripts/build-native-deps.ps1 (vcpkg, static, plus zlib) on Windows.
[tool.cibuildwheel]
build = ["cp312-*", "cp313-*", "cp314-*", "cp314t-*"]
skip = ["*-musllinux_*"]
test-groups = ["test"]
# setup.py: wheel tests load the Brotli version policy from it.
test-sources = ["tests", "benchmarks/server", "pyproject.toml", "setup.py"]
test-command = "pytest -q -p no:cacheprovider"

[tool.cibuildwheel.linux]
before-all = "bash scripts/build-native-deps.sh /usr/local"
# Same soname as a distro libbrotlidec still in the CVE-2026-111497 range.
# STARIO_PGO: profile-guided build (GCC), see CYTHON.md. "require" fails the
# wheel if the training run fails, instead of shipping one without a profile.
environment = { PKG_CONFIG_PATH = "/usr/local/lib/pkgconfig", LD_LIBRARY_PATH = "/usr/local/lib", STARIO_PGO = "require" }

[tool.cibuildwheel.macos]
before-all = "bash scripts/build-native-deps.sh /tmp/stario-deps"
# delocate rewrites each dylib path to a longer @loader_path one. The Xcode 16
# linker on macos-15 leaves no room for that without the header padding.
environment = { PKG_CONFIG_PATH = "/tmp/stario-deps/lib/pkgconfig", DYLD_LIBRARY_PATH = "/tmp/stario-deps/lib", LDFLAGS = "-Wl,-headerpad_max_install_names" }

[tool.cibuildwheel.windows]
# 64-bit x86 only: vcpkg builds one triplet per job, and the paths below name
# the x64 one (the script picks arm64-windows-static-md on an ARM64 host).
archs = ["AMD64"]
before-all = "pwsh -NoProfile -File scripts/build-native-deps.ps1 -Prefix C:/stario-deps"
# Static libraries: nothing for delvewheel to bundle.
environment = { PKG_CONFIG = "C:/stario-deps/vcpkg/installed/x64-windows-static-md/tools/pkgconf/pkgconf.exe", PKG_CONFIG_PATH = "C:/stario-deps/vcpkg/installed/x64-windows-static-md/lib/pkgconfig" }

[dependency-groups]
test = [
    "hypothesis>=6.148",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.4.0",
    "pytest-timeout>=2.3",
]
dev = [
    { include-group = "test" },
    "cython>=3.1,<4",
    "pyrefly>=1.4",
    "ruff>=0.12.8",
    "setuptools>=77",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# A hung test fails here instead of running to the CI limit.
timeout = 120
timeout_method = "thread"

[tool.pyrefly]
python-version = "3.12"
project-includes = ["src", "tests", "examples"]
project-excludes = ["benchmarks", "examples/jinja", "**/.venv", "**/__pycache__"]
search-path = [".", "src", "examples/chat-room"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests", "examples"]
exclude = [
    "benchmarks",
    ".venv",
    "__pycache__",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "UP", "B", "SIM", "RUF", "PT"]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
# Close-button glyph in markup examples and tests.
allowed-confusables = ["×"]

[tool.ruff.lint.isort]
# First-party roots aligned with pyrefly `project-includes`. Multi-file examples use an
# `app` package (see examples/chat-room); add other top-level example package
# names here when a new layout needs it.
known-first-party = ["stario", "stario_cython", "tests", "app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false
docstring-code-line-length = "dynamic"
