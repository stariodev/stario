name: CI

on:
  push:
    branches: [main, cython-core]
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # 3.14t is the free-threaded build: the cp314t wheel and
        # STARIO_THREADS>1 are only real if the suite runs with the GIL off.
        python-version: ["3.12", "3.13", "3.14", "3.14t"]
    runs-on: ubuntu-latest
    # A hung apt mirror or build stops here, not at the 6-hour default.
    timeout-minutes: 30
    env:
      # Ubuntu's 1.59 is new enough to test against; release wheels bundle 1.70.
      STARIO_ALLOW_OLD_NGHTTP2: "1"
      # Distro libbrotli is still in the CVE-2026-111497 range. The script
      # installs 1.2.1 under /usr/local; pkg-config and the loader must see
      # that copy before the distro one (same soname, libbrotlidec.so.1).
      PKG_CONFIG_PATH: /usr/local/lib/pkgconfig
      LD_LIBRARY_PATH: /usr/local/lib
      # The h2 tests that drive a real curl must run, not skip.
      STARIO_TEST_REQUIRE_HTTP2_CURL: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Native build dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            pkg-config cmake libnghttp2-dev libbrotli-dev libzstd-dev nghttp2-client
          bash scripts/build-native-deps.sh /usr/local brotli
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --all-extras
      - name: GIL is off on the free-threaded build
        if: matrix.python-version == '3.14t'
        run: |
          uv run python -c "import sys, stario_cython.exchange, stario_cython.protocol, stario_cython.markup, stario_cython.codecs, stario_cython.xxh64; assert not sys._is_gil_enabled(), 'an extension re-enabled the GIL'"
      - run: uv run ruff check src tests setup.py
      - run: uv run ruff format --check src tests setup.py
      - run: uv run pyrefly check
      - run: uv run pytest

  test-windows:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.14t"]
    runs-on: windows-latest
    # The first vcpkg build of the native libraries takes several minutes.
    timeout-minutes: 45
    env:
      VCPKG_DEFAULT_BINARY_CACHE: C:\vcpkg-binary-cache
      STARIO_TEST_REQUIRE_HTTP2_CURL: "1"
    steps:
      - uses: actions/checkout@v4
      # A new runner image (MSVC) changes vcpkg's ABI hashes: key on it so the
      # rebuilt binaries are saved, and restore the closest older cache.
      - id: image
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$env:ImageVersion"
      - uses: actions/cache@v4
        with:
          path: C:\vcpkg-binary-cache
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ steps.image.outputs.version }}-${{ hashFiles('scripts/build-native-deps.ps1') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ runner.arch }}-
      - name: Native build dependencies
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          ./scripts/build-native-deps.ps1
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --all-extras
      - name: GIL is off on the free-threaded build
        if: matrix.python-version == '3.14t'
        run: |
          uv run python -c "import sys, stario_cython.exchange, stario_cython.protocol, stario_cython.markup, stario_cython.codecs, stario_cython.xxh64; assert not sys._is_gil_enabled(), 'an extension re-enabled the GIL'"
      # Windows' own curl.exe has no HTTP/2 (nghttp2); the curl.se build does.
      # The tests run STARIO_TEST_CURL by absolute path: CreateProcess would
      # find System32's curl before anything on PATH.
      - name: curl with HTTP/2
        shell: pwsh
        run: |
          choco install curl --no-progress -y
          $curl = Join-Path $env:ChocolateyInstall "bin\curl.exe"
          & $curl --version
          Add-Content -Path $env:GITHUB_ENV -Value "STARIO_TEST_CURL=$curl"
      - run: uv run pytest
